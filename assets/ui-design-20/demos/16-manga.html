<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16 Manga Panel | Synapse Creations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=RocknRoll+One&family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--paper:#fff;--tone:#ff3b5c;--y:#ffd400}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:#ececec;color:var(--ink);font-family:'RocknRoll One',sans-serif;padding:24px 16px 110px}
a{color:inherit;text-decoration:none}
.book{max-width:1060px;margin:0 auto;background:var(--paper);padding:14px;border:3px solid var(--ink);box-shadow:10px 10px 0 rgba(0,0,0,.18);display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.pn{position:relative;border:4px solid var(--ink);overflow:hidden;background:var(--paper);min-height:200px}
.tone{position:absolute;inset:0;background-image:radial-gradient(var(--ink) 1.2px,transparent 1.4px);background-size:9px 9px;opacity:.16;pointer-events:none}
.speed{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,transparent 0 3deg,rgba(0,0,0,.85) 3deg 3.6deg,transparent 3.6deg 9deg);-webkit-mask:radial-gradient(circle,transparent 28%,#000 62%);mask:radial-gradient(circle,transparent 28%,#000 62%);opacity:0;transition:opacity .2s;pointer-events:none}
.pn:hover .speed,.pn.hit .speed{opacity:.55}
.p1{grid-column:1/5;grid-row:span 2;min-height:420px;display:flex;align-items:flex-end;padding:22px}
.p1 h1{position:relative;font-family:'Dela Gothic One';font-size:clamp(40px,7vw,86px);line-height:.95;z-index:2;text-shadow:4px 4px 0 var(--y)}
.p1 .mitama{position:absolute;right:6%;top:10%;width:42%;max-width:260px;aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);overflow:hidden;cursor:pointer;z-index:2;background:#eee;transition:transform .2s}
.p1 .mitama:active{transform:scale(.94) rotate(-4deg)}
.p1 .mitama img{width:100%;height:100%;object-fit:cover}
.bubble{position:absolute;z-index:3;background:#fff;border:3px solid var(--ink);border-radius:50%;padding:18px 22px;font-size:clamp(14px,1.6vw,18px);text-align:center;line-height:1.4}
.bubble::after{content:'';position:absolute;width:26px;height:26px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.p1 .bubble{right:42%;top:8%}
.p1 .bubble::after{right:18px;bottom:-15px;transform:rotate(-10deg) skew(20deg)}
.sfx{position:absolute;font-family:'Bangers';font-size:clamp(40px,6vw,80px);color:var(--tone);-webkit-text-stroke:3px var(--ink);transform:rotate(-12deg);z-index:2;pointer-events:none;letter-spacing:.04em}
.p2{grid-column:5/7;padding:16px;display:flex;flex-direction:column;justify-content:center;background:var(--ink);color:#fff}
.p2 p{font-size:15px;line-height:1.8}
.p2 b{font-family:'Dela Gothic One';font-size:24px;color:var(--y)}
.p3{grid-column:5/7;padding:0}
.p3 img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.3);display:block}
.wk{grid-column:span 2;display:block;padding:10px 10px 14px;transition:transform .15s}
.wk:hover{transform:rotate(-1.5deg) scale(1.02);z-index:2}
.wk img{width:100%;aspect-ratio:4/3;object-fit:cover;border:3px solid var(--ink);display:block;filter:grayscale(.6) contrast(1.15)}
.wk:hover img{filter:none}
.wk h3{font-family:'Dela Gothic One';font-size:20px;margin-top:8px;position:relative;z-index:2}
.wk p{font-size:13px;position:relative;z-index:2}
.wk .tag{position:absolute;right:16px;top:16px;z-index:2;background:var(--y);border:3px solid var(--ink);padding:2px 8px;font-family:'Bangers';font-size:18px;transform:rotate(6deg)}
.p7{grid-column:1/4;display:flex;gap:14px;align-items:center;padding:16px}
.p7 img{width:110px;height:110px;object-fit:cover;border:3px solid var(--ink)}
.p7 h3{font-family:'Dela Gothic One';font-size:22px}
.p8{grid-column:4/7;display:grid;place-items:center;padding:20px;text-align:center;background:var(--y)}
.p8 h3{font-family:'Dela Gothic One';font-size:clamp(22px,3vw,34px)}
.p8 small{display:block;margin-top:8px}
.pop{position:fixed;font-family:'Bangers';font-size:56px;color:var(--y);-webkit-text-stroke:3px var(--ink);pointer-events:none;z-index:30;animation:pop .7s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3) rotate(-20deg)}40%{transform:translate(-50%,-50%) scale(1.2) rotate(8deg)}100%{transform:translate(-50%,-90%) scale(1) rotate(-4deg);opacity:0}}
@media (max-width:820px){.book{grid-template-columns:1fr 1fr}.p1,.p2,.p3,.p7,.p8{grid-column:1/3}.wk{grid-column:span 2}.p1{min-height:360px}.p1 .bubble{right:auto;left:6%;top:6%}}
</style>
</head>
<body>
<div class="book">
  <div class="pn p1" id="p1"><span class="tone"></span><span class="speed"></span>
    <div class="mitama" id="mitama"><img src="https://fumifum1.github.io/main/jpg/artist-image.jpg" alt="Mitama"></div>
    <div class="bubble" id="bub">やあ！<br>ミタマだよ！</div>
    <span class="sfx" style="left:6%;top:12%">DON!</span>
    <h1>Synapse<br>Creations</h1>
  </div>
  <div class="pn p2"><p><b>第1話</b><br>音と映像、そしてAIが<br>織りなす無限の可能性。<br>――物語はここから始まる。</p></div>
  <div class="pn p3"><img src="https://fumifum1.github.io/main/jpg/artist1.jpg" alt=""></div>
  <a class="pn wk" href="https://fumifum1.github.io/game/bingo.html" target="_blank"><span class="tone"></span><span class="speed"></span><span class="tag">GAME</span><img src="https://fumifum1.github.io/main/jpg/bingo.jpg" alt=""><h3>BINGO</h3><p>「台紙と抽選、同時だと…！？」</p></a>
  <a class="pn wk" href="https://fumifum1.github.io/game/" target="_blank"><span class="tone"></span><span class="speed"></span><span class="tag">GAME</span><img src="https://fumifum1.github.io/main/jpg/game-thumbnail2.jpg" alt=""><h3>Arcade Invade</h3><p>「レベル10まで…撃ちまくれ！」</p></a>
  <a class="pn wk" href="https://fumifum1.github.io/works/kippoui-navi/" target="_blank"><span class="tone"></span><span class="speed"></span><span class="tag">TOOL</span><img src="https://fumifum1.github.io/main/jpg/k_n.png" alt=""><h3>Celestial Compass</h3><p>「今日の吉方位は――北東！」</p></a>
  <div class="pn p7"><span class="tone"></span><img src="https://fumifum1.github.io/main/jpg/y_b.jpg" alt=""><div><h3>BEAR BEER BEAT</h3><p>♪ そのまま進め、ゆっくり歩いていこう</p><p style="font-size:12px;margin-top:4px">▶ タップで再生</p></div></div>
  <div class="pn p8"><div><h3>つづく…！</h3><small>広告なし。バグはご愛敬。</small></div></div>
</div>
<script>
// コマにホバー/タップすると集中線と効果音の文字が出る
const SFX = ['ポチッ', 'バーン!', 'シュッ', 'ドドド', 'キラッ', 'BOOM!'];
document.querySelectorAll('.pn').forEach(p => p.addEventListener('pointerdown', e => {
  const s = document.createElement('span'); s.className = 'pop';
  s.textContent = SFX[Math.floor(Math.random() * SFX.length)];
  s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px';
  document.body.appendChild(s); setTimeout(() => s.remove(), 720);
  p.classList.add('hit'); setTimeout(() => p.classList.remove('hit'), 300);
}));
// Mitama をタップすると吹き出しのセリフが変わる
const lines = ['やあ！<br>ミタマだよ！', 'このコマ、<br>ぼくが主役？', 'バグは<br>ご愛敬だよ', '次のページも<br>見てね！', 'ドーン！'];
let i = 0;
document.getElementById('mitama').addEventListener('click', () => document.getElementById('bub').innerHTML = lines[++i % lines.length]);
</script>
<script src="music.js" data-tracks=".p7"></script>
<script src="nav.js"></script>
</body>
</html>
