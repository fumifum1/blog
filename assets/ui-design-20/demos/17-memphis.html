<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 Memphis 80s | Synapse Creations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Kosugi+Maru&family=Righteous&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5e6;--ink:#1d1a3a;--t:#00b3a6;--m:#ff3e8a;--y:#ffd23f;--p:#6c4bd8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Kosugi Maru',sans-serif;background-image:radial-gradient(var(--ink) 1.5px,transparent 1.6px);background-size:26px 26px;background-color:var(--bg)}
body::before{content:'';position:fixed;inset:0;background:rgba(255,245,230,.88);z-index:-2}
a{color:inherit;text-decoration:none}
.shapes{position:fixed;inset:0;z-index:-1;pointer-events:none}
.sh{position:absolute;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.tri{width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:52px solid var(--m)}
.cir{width:56px;height:56px;border-radius:50%;border:8px solid var(--t)}
.sq{width:46px;height:46px;background:var(--y);border:4px solid var(--ink)}
.zig{width:110px;height:24px;background:linear-gradient(135deg,var(--p) 25%,transparent 25%) -12px 0/24px 24px,linear-gradient(225deg,var(--p) 25%,transparent 25%) -12px 0/24px 24px}
.squig{width:90px;height:30px;border:6px solid var(--ink);border-color:var(--ink) transparent transparent;border-radius:50%}
nav{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;padding:22px 16px}
nav b{font-family:'Bungee';font-size:22px;color:var(--p)}
nav div{display:flex;gap:10px}
nav div a{font-family:'Righteous';padding:8px 16px;border:3px solid var(--ink);border-radius:999px;background:#fff;box-shadow:4px 4px 0 var(--m)}
nav div a:hover{background:var(--y)}
.hero{max-width:1100px;margin:0 auto;padding:60px 16px 40px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
.hero h1{font-family:'Bungee';font-size:clamp(46px,8.5vw,110px);line-height:.95;color:var(--ink)}
.hero h1 span:nth-child(1){color:var(--m);text-shadow:6px 6px 0 var(--t)}
.hero h1 span:nth-child(3){color:var(--t);text-shadow:6px 6px 0 var(--y)}
.hero p{font-size:18px;margin:24px 0;background:#fff;border:3px solid var(--ink);display:inline-block;padding:10px 16px;box-shadow:6px 6px 0 var(--p)}
.frame{position:relative;justify-self:center;width:min(320px,80vw);aspect-ratio:1}
.frame::before{content:'';position:absolute;inset:0;background:var(--y);border:4px solid var(--ink);transform:translate(18px,18px) rotate(6deg)}
.frame::after{content:'';position:absolute;width:90px;height:90px;border-radius:50%;background:var(--m);border:4px solid var(--ink);right:-30px;top:-30px}
.frame img{position:relative;width:100%;height:100%;object-fit:cover;border:4px solid var(--ink);z-index:1}
.wrap{max-width:1100px;margin:0 auto;padding:30px 16px 120px}
h2{font-family:'Bungee';font-size:clamp(32px,5vw,58px);margin:40px 0 26px}
h2::after{content:'';display:block;width:140px;height:14px;margin-top:8px;background:linear-gradient(135deg,var(--t) 25%,transparent 25%) -7px 0/14px 14px,linear-gradient(225deg,var(--t) 25%,transparent 25%) -7px 0/14px 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.card{position:relative;display:block;background:#fff;border:4px solid var(--ink);padding:12px 12px 18px;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.card::before{content:'';position:absolute;inset:0;z-index:-1;transform:translate(12px,12px);border:4px solid var(--ink)}
.card:nth-child(1)::before{background:var(--m)}.card:nth-child(2)::before{background:var(--t)}.card:nth-child(3)::before{background:var(--p)}
.card:hover{transform:translate(-4px,-4px) rotate(-2deg)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;border:3px solid var(--ink);display:block}
.card h3{font-family:'Righteous';font-size:22px;margin-top:10px}
.card p{font-size:13px}
.tracks{display:flex;gap:18px;flex-wrap:wrap}
.tk{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 18px 8px 8px;box-shadow:5px 5px 0 var(--y);font-family:'Righteous'}
.tk img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid var(--ink)}
.conf{position:fixed;z-index:20;pointer-events:none;animation:conf 1.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
footer{text-align:center;padding:30px 0 90px;font-family:'Righteous'}
@media (max-width:820px){.hero,.grid{grid-template-columns:1fr}nav div{display:none}}
</style>
</head>
<body>
<div class="shapes" id="shapes">
  <span class="sh tri" style="left:6%;top:18%"></span><span class="sh cir" style="left:82%;top:14%"></span><span class="sh sq" style="left:70%;top:62%;rotate:20deg"></span>
  <span class="sh zig" style="left:12%;top:72%"></span><span class="sh squig" style="left:44%;top:8%"></span><span class="sh cir" style="left:30%;top:86%;border-color:var(--m)"></span>
  <span class="sh tri" style="left:90%;top:80%;border-bottom-color:var(--y)"></span><span class="sh sq" style="left:52%;top:46%;background:var(--t)"></span>
</div>
<nav><b>SYNAPSE</b><div><a href="#works">Works</a><a href="#music">Music</a><a href="https://fumifum1.github.io/main/blog.html" target="_blank" rel="noopener">Blog</a></div></nav>
<header class="hero">
  <div>
    <h1><span>Synapse</span><br><span>Crea</span><span>tions</span></h1>
    <p>音と映像、そしてAIが織りなす無限の可能性。</p>
  </div>
  <div class="frame"><img src="https://fumifum1.github.io/main/jpg/artist-image.jpg" alt="Mitama"></div>
</header>
<main class="wrap">
  <h2 id="works">Works</h2>
  <div class="grid">
    <a class="card" href="https://fumifum1.github.io/game/bingo.html" target="_blank"><img src="https://fumifum1.github.io/main/jpg/bingo.jpg" alt=""><h3>BINGO</h3><p>台紙と抽選がいっしょに</p></a>
    <a class="card" href="https://fumifum1.github.io/works/qr.html" target="_blank"><img src="https://fumifum1.github.io/main/jpg/q_c.png" alt=""><h3>QR.create</h3><p>オリジナルQRコード</p></a>
    <a class="card" href="https://fumifum1.github.io/works/GraffitiStudio.html" target="_blank"><img src="https://fumifum1.github.io/main/jpg/v_p.jpg" alt=""><h3>GraffitiStudio</h3><p>AIプロンプト工房</p></a>
  </div>
  <h2 id="music">Music</h2>
  <div class="tracks">
    <div class="tk"><img src="https://fumifum1.github.io/main/jpg/y_b.jpg" alt="">そのまま進め、ゆっくり歩いていこう</div>
    <div class="tk"><img src="https://fumifum1.github.io/main/jpg/song8.jpg" alt="">Hamburg steak recipe</div>
    <div class="tk"><img src="https://fumifum1.github.io/main/jpg/song1-2.jpg" alt="">ありのままで2</div>
  </div>
</main>
<footer>© 2025 Synapse Creations — Mitama: CNP</footer>
<script>
// 図形はカーソルから逃げるように少しずれる
const shapes = [...document.querySelectorAll('.sh')];
addEventListener('pointermove', e => shapes.forEach(s => {
  const r = s.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dx = cx - e.clientX, dy = cy - e.clientY, d = Math.hypot(dx, dy);
  s.style.transform = d < 160 ? `translate(${dx / d * (160 - d) * .5}px,${dy / d * (160 - d) * .5}px) rotate(${dx / 8}deg)` : '';
}));
// クリックすると80年代風の図形が飛び散る
const kinds = ['tri', 'cir', 'sq', 'zig'], cols = ['#00b3a6', '#ff3e8a', '#ffd23f', '#6c4bd8'];
addEventListener('click', e => {
  if (e.target.closest('a')) return;
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('span'), k = kinds[i % 4], c = cols[i % 4];
    s.className = 'sh conf ' + k;
    s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px'; s.style.scale = .5;
    if (k === 'tri') s.style.borderBottomColor = c; else if (k === 'cir') s.style.borderColor = c; else if (k === 'sq') s.style.background = c;
    s.style.setProperty('--dx', (Math.random() * 300 - 150) + 'px'); s.style.setProperty('--dy', (Math.random() * 300 - 200) + 'px'); s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1250);
  }
});
</script>
<script src="music.js" data-tracks=".tk"></script>
<script src="nav.js"></script>
</body>
</html>
